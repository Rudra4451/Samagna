name: BanaSetu Continuous Integration

on:
  push:
    branches: [ master, main, feat/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  audit-and-test:
    name: Run BanaSetu Audit & Verification Suites
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

      - name: Run Inclusive Design & Accessibility Audit (A11y)
        run: npm run test:a11y

      - name: Run Bilingual English/Odia Key Parity Audit (i18n)
        run: npm run test:i18n

      - name: Run Authentication & RBAC Test Suite (F2/F3)
        run: npm run test:auth

      - name: Run Tribal Collector Interface Test Suite (F3/F8)
        run: npm run test:collector

      - name: Run Collection Center Intake & Scale Math Test Suite (F4/F9)
        run: npm run test:collection

      - name: Run Warehouse Arrival & Transit Shrinkage Test Suite (F5/F10)
        run: npm run test:inventory

      - name: Run Backend Architecture, Rate Limiting & Security Test Suite (F4/F15)
        run: npm run test:backend

      - name: Run Multipart Upload & Evidence Hashing Test Suite (F5)
        run: npm run test:uploads

      - name: Run 17 MFP Catalogue & Geography Test Suite (G1/G2/G3)
        run: npm run test:catalogue

      - name: Run Administration & Governance Test Suite (F11/G6)
        run: npm run test:admin

      - name: Run Dead-Button, Link & Workflow Integrity Audit (G4)
        run: npm run test:flows

      - name: Run Production Bundle Build Verification (F16/G8)
        run: npm run build
