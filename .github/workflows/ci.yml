name: Samagna Continuous Integration

on:
  push:
    branches: [ master, main, feat/* ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  audit-and-test:
    name: Run Samagna Audit & Verification Suites
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: 'samagna-ci-testing-auth-secret-key-minimum-32-chars'
      ALLOW_DEMO_ACCOUNTS: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

      - name: Run ESLint verification
        run: npm run lint

      - name: Run Comprehensive Verification Test Suites (All 24 Suites)
        run: npm run test:all

      - name: Run Production Bundle Build Verification
        run: npm run build
