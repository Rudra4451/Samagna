services:
  - type: web
    name: bana-setu
    env: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: ALLOW_DEMO_ACCOUNTS
        value: "true"
      - key: PORT
        value: 3000
